name: jdonuts
description: "J'Donuts customer app — onboarding, offline-first Home and Product detail, animated Rewards."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

workspace:
  - packages/app_core
  - packages/app_network
  - packages/app_storage
  - packages/app_ui_kit

dependencies:
  app_core:
    path: packages/app_core
  app_network:
    path: packages/app_network
  app_storage:
    path: packages/app_storage
  app_ui_kit:
    path: packages/app_ui_kit
  bloc: ^9.2.1
  cached_network_image: ^4.0.3
  characters: ^1.4.1
  clock: ^1.1.2
  connectivity_plus: ^7.3.2
  cupertino_icons: ^2.0.0
  dio: ^5.11.1
  drift: ">=2.30.0 <2.35.0"
  drift_flutter: ^0.3.1
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_cache_manager: ^3.5.0
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  get_it: ^9.3.0
  go_router: ^18.1.3
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/seed/
