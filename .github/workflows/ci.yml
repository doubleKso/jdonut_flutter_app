name: CI

on:
  push:
  pull_request:

env:
  FLUTTER_VERSION: 3.44.9

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Analyze the mock server
        working-directory: mock_server
        run: |
          dart pub get
          dart analyze

  android:
    name: Android release APK
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: jdonuts-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS simulator build
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # A simulator build needs no signing. Drag Runner.app onto a booted
      # simulator, or: xcrun simctl install booted Runner.app
      - run: flutter build ios --simulator --debug
      - name: Zip Runner.app
        working-directory: build/ios/iphonesimulator
        run: zip -r -y Runner.app.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: jdonuts-ios-simulator-app
          path: build/ios/iphonesimulator/Runner.app.zip

  integration:
    name: Integration test (Android emulator)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: flutter test integration_test
